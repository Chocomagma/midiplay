<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Simple Piano 3 Octave</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1e1e1e;
    font-family:Arial;
    overflow:hidden;
}

.wrapper{
    text-align:center;
    color:white;
}

.info{
    margin-bottom:20px;
    font-size:18px;
    line-height:1.8;
}

.piano{
    position:relative;
    display:flex;
}

.white{
    width:70px;
    height:300px;
    background:white;
    border:1px solid black;
    box-sizing:border-box;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:10px;
    font-weight:bold;
    user-select:none;
    color:black;
}

.white.active{
    background:#dcdcdc;
}

.black{
    position:absolute;
    width:45px;
    height:180px;
    background:black;
    color:white;
    z-index:2;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:10px;
    box-sizing:border-box;
    font-weight:bold;
    user-select:none;
}

.black.active{
    background:#444;
}

</style>
</head>
<body>

<div class="wrapper">

    <div class="info">
        OCTAVE : <span id="octaveText">NORMAL</span><br>
        A = LOWER OCTAVE<br>
        S = HIGHER OCTAVE
    </div>

    <div class="piano">

        <!-- WHITE -->
        <div class="white" data-key="f">F<br>C</div>
        <div class="white" data-key="g">G<br>D</div>
        <div class="white" data-key="h">H<br>E</div>
        <div class="white" data-key="j">J<br>F</div>
        <div class="white" data-key="k">K<br>G</div>
        <div class="white" data-key="l">L<br>A</div>
        <div class="white" data-key=";">;<br>B</div>
        <div class="white" data-key="'">'<br>C</div>

        <!-- BLACK -->
        <div class="black" style="left:48px" data-key="5">5</div>
        <div class="black" style="left:118px" data-key="6">6</div>

        <div class="black" style="left:258px" data-key="8">8</div>
        <div class="black" style="left:328px" data-key="9">9</div>
        <div class="black" style="left:398px" data-key="0">0</div>

    </div>

</div>

<script>

const audioContext =
    new (window.AudioContext || window.webkitAudioContext)();

let octaveMode = 0;

// sustain state
let sustain = false;

const octaveText = document.getElementById("octaveText");

const notes = {

    // WHITE
    "f":261.63,
    "g":293.66,
    "h":329.63,
    "j":349.23,
    "k":392.00,
    "l":440.00,
    ";":493.88,
    "'":523.25,

    // BLACK
    "5":277.18,
    "6":311.13,
    "8":369.99,
    "9":415.30,
    "0":466.16
};

function updateOctaveText(){

    let text = "NORMAL";

    if(octaveMode === -1){
        text = "LOW";
    }

    if(octaveMode === 1){
        text = "HIGH";
    }

    if(sustain){
        text += " | SUSTAIN";
    }

    octaveText.innerText = text;
}

function play(freq){

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "triangle";

    if(octaveMode === 1){
        freq *= 2;
    }

    if(octaveMode === -1){
        freq /= 2;
    }

    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audioContext.destination);

    // volume awal
    gain.gain.setValueAtTime(
        0.2,
        audioContext.currentTime
    );

    osc.start();

    // sustain ON
    if(sustain){

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 4
        );

        osc.stop(audioContext.currentTime + 4);
    }

    // sustain OFF
    else{

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 1
        );

        osc.stop(audioContext.currentTime + 1);
    }
}

function activate(key){

    const el = document.querySelector(`[data-key="${key}"]`);

    if(!el) return;

    play(notes[key]);

    el.classList.add("active");

    setTimeout(()=>{

        el.classList.remove("active");

    },100);
}

document.addEventListener("keydown",(e)=>{

    const key = e.key.toLowerCase();

    // prevent browser scroll
    if(key === " "){
        e.preventDefault();
    }

    // SUSTAIN
    if(key === " "){
        sustain = true;
        updateOctaveText();
        return;
    }

    // OCTAVE CONTROL
    if(key === "a"){
        octaveMode = -1;
        updateOctaveText();
        return;
    }

    if(key === "s"){
        octaveMode = 1;
        updateOctaveText();
        return;
    }

    activate(key);
});

document.addEventListener("keyup",(e)=>{

    const key = e.key.toLowerCase();

    // sustain off
    if(key === " "){
        sustain = false;
        updateOctaveText();
    }

    // octave reset
    if(key === "a" || key === "s"){
        octaveMode = 0;
        updateOctaveText();
    }
});

updateOctaveText();
